[project]
name = "ov-convert"
version = "0.1.0"
description = "OpenVINO Model Conversion Utility"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub>=1.17.0",
  "nncf>=3.2.0",
  "openvino>=2026.2.0",
  "openvino-genai>=2026.2.0",
  "openvino-tokenizers>=2026.2.0",
  "optimum-intel[openvino]>=1.15.0",
  "pillow>=12.2.0",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "transformers>=5.0.0",
]


[dependency-groups]
dev = [
    "prek>=0.3.1",
    "ruff>=0.12.12",
    "ty>=0.0.15",
]

[tool.setuptools]
include-package-data = true
platforms = ["any"]
zip-safe = false

[tool.setuptools.package-data]
GrossOrders = ["py.typed"]

[tool.uv.sources]
optimum-intel = { git = "https://github.com/huggingface/optimum-intel" }
